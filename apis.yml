aid: carrier-global
name: Carrier Global
description: >-
  Carrier Global Corporation is a global provider of healthy, safe, sustainable,
  and intelligent building and cold-chain solutions, spanning HVAC, refrigeration,
  fire, security, and building automation technologies. Its digital ecosystem
  includes the Lynx Fleet telematics platform (Lynx APIs for transport
  refrigeration units and marine containers), the Abound building management
  platform, i-Vu and Carrier Comfort Network for commercial building automation,
  and the Carrier SmartHome app for residential smart thermostats. Lynx Fleet is
  the only Carrier product publishing machine-readable API contracts: three
  OpenAPI 3.0.0 documents covering 16 operations across truck/trailer telematics,
  two-way refrigeration control and container telemetry, served through the
  developer portal's public GraphQL backend rather than as static files.
