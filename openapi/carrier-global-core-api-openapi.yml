        nextToken:
          description: A pagination token used to return a set of results
          type: string
          example: AYABeCfa0bJE93-3AxGARdk1MAoAAAABAAdhd3Mta21zAEt
          minLength: 1
          maxLength: 2048
      example:
        assetName: TestAssetName
    StatusInfo:
      type: object
      description: An object containing information about the state of the Transport Refrigeration Unit at the time of the message.
      properties:
        powerStatus:
          type: string
          description: Transport Refrigeration Unit Power Status (On or Off)
          example: 'off'
        switchOnHours:
          type: number
          description: The total accumulated hours that the Transport Refrigeration Unit has been turned on.
          example: 859
        engineRunHours:
          type: number
          description: The total accumulated hours that the Transport Refrigeration Unit has been running on its engine.
          example: 4
        batteryVoltage:
          type: number
          example: 12.9
          description: The voltage of the Transport Refrigeration Unit's 12V battery.
        batteryCurrent:
          type: number
          example: 0.05
          description: Battery Current (Device).
        deviceBatteryPowerSupply:
          type: number
          example: 2.05
          description: Battery Power Supply (Device).
        deviceBatteryVoltage:
          type: number
          example: 3.01
          description: Battery Voltage of the Device.
        rearDoorOpen:
          type: boolean
          description: Indicates if the rear door on the truck or trailer is open or not.
          example: false
        sideDoorOpen:
          type: boolean
          description: Indicates if the side door on the truck or trailer is open or not.
          example: false
        fuelLevel:
          type: number
          description: Transport Refrigeration Unit Fuel Level (%).
          example: 20
        truStatus:
          type: string
          description: Overall Status of the Transport Refrigeration Unit.
          enum:
          - 'OFF'
          - 'ON'
          example: 'ON'
        comp1OperatingMode:
          type: string
          description: Operating mode of Compartment 1.
          example: Heat
        comp2OperatingMode:
          type: string
          description: Operating mode of Compartment 2.
          example: Off,  (compartment Off due to engine off)
        comp3OperatingMode:
          type: string
          description: Operating mode of Compartment 3.
          example: Off,  (compartment Off due to engine off)
        comp1Status:
          type: boolean
          description: On/Off Status of Compartment 1.
          example: true
        comp2Status:
          type: boolean
          description: On/Off Status of Compartment 2.
          example: true
        comp3Status:
          type: boolean
          description: On/Off Status of Compartment 3.
          example: false
        positionSpeed:
          type: number
          description: Speed of the unit at the time of the message.
          example: 0
        vehicleMileage:
          type: number
          description: Mileage of the unit at the time of the message.
          example: 5
        standByHours:
          type: number
          description: The total accumulated hours that the Transport Refrigeration Unit has been running on stand by, or electric, power.
          example: 150
        movementStatus:
          type: boolean
          description: Indicates if the unit is moving or not.
          example: false
        enginePowerMode:
          type: string
          description: Transport Refrigeration Unit Power Source (Engine or Standby).
          enum:
          - Standby
          - Engine
          example: Standby
        engineControlMode:
          type: string
          description: Transport Refrigeration Unit Control Mode.
          enum:
          - Continuous
          - Start/Stop
          example: Continuous
        engineSpeed:
          type: string
          description: Transport Refrigeration Unit Engine Speed.
          enum:
          - Engine speed High
          - Engine speed Low
          - Engine speed very Low
          - Engine speed very High
          example: Engine speed High
        switchKeyStatus:
          type: boolean
          example: true
          description: Lcv switch key status.
        roadEnergy:
          type: number
          example: 123
          description: Lcv road energy.
        standByEnergy:
          type: number
          example: 13
          description: Lcv standBy Energy.
        powerMode:
          type: number
          example: 15
          description: Lcv power mode.
    MultiAssetBatteryHistoryRequest:
      type: object
      required:
      - startDate
      - endDate
      - assets
      properties:
        assets:
          description: Retrieve battery history using array of asset ids(could be mixed with truSerialNumbers). Requests are limited to 10 asset ids
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/AssetParamWithId'
            - $ref: '#/components/schemas/AssetParamWithTruSerialNumber'
          example:
          - assetId: TestAssetIdAsset1
            nextToken: AYABeCfa0bJE93-3AxGARdk1MAoAAAABAAdhd3Mta21zAEt
          - assetId: TestIdAsset2
          - truSerialNumber: TestAssetTruSerialNumberAsset4
        startDate:
          description: Return data after this input. UTC date in ISO Date Time Format yyyy-MM-dd'T'HH:mm:ssZ. startDate - endDate range cannot exceed 1 day
          type: string
          format: date-time
          example: '2019-05-17T08:30:00Z'
        endDate:
          description: Return data before this input. UTC date in ISO Date Time Format yyyy-MM-dd'T'HH:mm:ssZ. startDate - endDate range cannot exceed 1 day
          type: string
          format: date-time
          example: '2019-05-17T08:30:00Z'
        limit:
          description: The number of items to return
          type: integer
          minimum: 1
          maximum: 100
    AssetBatteryInfo:
      type: object
      description: Represents basic info about Asset
      properties:
