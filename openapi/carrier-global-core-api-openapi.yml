openapi: 3.2.0
info:
  title: Carrier Global Core API
  version: 1.0.0
  description: 'Operations tagged core across 2 of this provider''s published API definitions: carrier-global-lynx-2way-command-api-openapi.yaml, carrier-global-lynx-fleet-api-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.fleet.lynx.carrier.io/2waycmd
  description: prod
- url: https://api.fleet.lynx.carrier.io
  description: prod
security:
- x-lynx-api-key: []
tags:
- name: Core
paths:
  /v1/check-command-status:
    get:
      operationId: check-2way-command-status
      description: This operation will return commands status list
      tags:
      - Core
      parameters:
      - name: assetId
        in: query
        description: Asset id (optional,but one is required -  assetID, assetName or truSerialNumber)
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
          example: a7f39dec-ca34-47d3-97a7-66bcfda0396b
      - name: assetName
        in: query
        description: Asset name (optional,but one is required -  assetID, assetName or truSerialNumber)
        required: false
        allowEmptyValue: false
        schema:
          type: string
          example: Sample Asset
      - name: commandId
        in: query
        description: Command id
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
          example: 05b419f2-f064-489d-ade7-8249839a23ed
      - name: truSerialNumber
        in: query
        description: Asset TRU serial number (optional,but one is required -  assetID, assetName or truSerialNumber)
        required: false
        allowEmptyValue: false
        schema:
          type: string
          example: HD12345
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandsStatusList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRequestError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenRequestError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
      summary: Check 2way command status
      x-summary-source: derived
    servers:
    - url: https://api.fleet.lynx.carrier.io/2waycmd
      description: prod
  /v1/get-commands:
    get:
      operationId: get-2way-commands
      description: This operation will return list of available commands.
      tags:
      - Core
      parameters:
      - name: assetId
        in: query
        description: Asset id (optional, but one is required -  assetID, assetName or truSerialNumber)
        required: false
