provider: Carrier Global
providerId: carrier-global
purpose: >-
  Carrier runs two machine surfaces that are NOT projections of one another: a
  key-authenticated REST telematics API on api.fleet.lynx.carrier.io, and a GraphQL
  backend on api.portal.fleet.lynx.carrier.io that serves the developer portal itself.
  This file binds them so neither is silently dropped.
surfaces:
  openapi:
    - file: openapi/carrier-global-lynx-fleet-api-openapi.yaml
      server: https://api.fleet.lynx.carrier.io
      operations: 10
      gated: true
      gate: x-lynx-api-key header; the host returns 401 to anonymous requests on every path
    - file: openapi/carrier-global-lynx-2way-command-api-openapi.yaml
      server: https://api.fleet.lynx.carrier.io/2waycmd
      operations: 3
      gated: true
    - file: openapi/carrier-global-lynx-container-api-openapi.yaml
      server: https://api.fleet.lynx.carrier.io/coa
      operations: 3
      gated: true
  graphql:
    endpoint: https://api.portal.fleet.lynx.carrier.io/public/graphql
    gated: false
    introspection: disabled
    note: >-
      Anonymous and live, but introspection is off, so the field list below is only what
      was actually executed and observed, never a schema listing.
  mcp:
    url: null
    status: none
    note: Carrier ships no MCP server; mcp/carrier-global-mcp.yml is a candidate.
