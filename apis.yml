apis:
  - aid: carrier-global:lynx-fleet-api
    name: Carrier Lynx Fleet API
    description: >-
      REST API surface exposing Lynx Fleet telematics data for diesel and electric
      transport refrigeration units (TRUs). Ten operations covering asset inventory,
      latest-state snapshots, asset and multi-asset history, battery state and battery
      history, the alarm-code dictionary, and two ingestion endpoints for third-party
      sensor (SCB) and Orbcomm telematics payloads. Cursor paginated with limit and
      nextToken, authenticated with a tenant API key in the x-lynx-api-key header.
    humanURL: https://doc-api.fleet.lynx.carrier.io/
    baseURL: https://api.fleet.lynx.carrier.io
    tags:
      - Cold Chain
      - Telematics
      - Fleet
      - Refrigeration
      - IoT
    properties:
      - type: OpenAPI
        url: openapi/carrier-global-lynx-fleet-api-openapi.yaml
      - type: Overlay
        url: overlays/carrier-global-lynx-fleet-api-overlay.yaml
      - type: Documentation
        url: https://doc-api.fleet.lynx.carrier.io/
      - type: APIReference
        url: https://api.tta.lynxfleet.carrier.com/apis
      - type: Portal
        url: https://api.tta.lynxfleet.carrier.com/
      - type: GettingStarted
        url: https://doc-api.fleet.lynx.carrier.io/api-documentation
      - type: TermsOfService
        url: https://www.carrier.com/lynx/terms-of-use
      - type: Products
        url: https://api.tta.lynxfleet.carrier.com/products
  - aid: carrier-global:lynx-2way-command-api
    name: Carrier Lynx 2-way Command API
    description: >-
      Remote-control surface for Lynx-connected transport refrigeration units. Three
      operations: list the commands a given asset supports, send one or more commands,
      and check the status of a dispatched command by commandId. Commands include
      per-compartment setpoints in the range -30 to 35 °C, compartment toggles, defrost
      initiation, pre-trip initiation, alarm clearing, run mode, sleep mode, TRU power
      and Intelliset selection. This is physical actuation: Carrier publishes no
      idempotency key, no dry-run mode and no reversal operation for it.
    humanURL: https://doc-api.fleet.lynx.carrier.io/
    baseURL: https://api.fleet.lynx.carrier.io/2waycmd
    tags:
      - Cold Chain
      - Refrigeration
      - Remote Control
      - Telematics
      - IoT
    properties:
      - type: OpenAPI
        url: openapi/carrier-global-lynx-2way-command-api-openapi.yaml
      - type: Overlay
        url: overlays/carrier-global-lynx-2way-command-api-overlay.yaml
      - type: Documentation
        url: https://doc-api.fleet.lynx.carrier.io/
      - type: APIReference
        url: https://api.tta.lynxfleet.carrier.com/apis
  - aid: carrier-global:lynx-container-api
    name: Carrier Lynx Container API
    description: >-
      Telemetry surface for Carrier-managed marine and intermodal refrigerated
      containers, published as a separate contract with its own data model. Three
      operations: the container Unified Model property and alarm definitions, latest
      source data, and container asset history. Shares the x-lynx-api-key
      authentication, the error envelope and the monthly call quota with the fleet API,
      but shares none of its schemas.
    humanURL: https://doc-api.fleet.lynx.carrier.io/
    baseURL: https://api.fleet.lynx.carrier.io/coa
    tags:
      - Cold Chain
      - Container
      - Telematics
      - Refrigeration
      - IoT
    properties:
      - type: OpenAPI
        url: openapi/carrier-global-lynx-container-api-openapi.yaml
      - type: Overlay
        url: overlays/carrier-global-lynx-container-api-overlay.yaml
      - type: Documentation
        url: https://doc-api.fleet.lynx.carrier.io/
      - type: APIReference
        url: https://api.tta.lynxfleet.carrier.com/apis
  - aid: carrier-global:lynx-portal-graphql
    name: Carrier Lynx Dev Portal GraphQL
    description: >-
      The GraphQL backend behind the Lynx Fleet Dev Portal. Its /public/graphql
      endpoint answers anonymously and is the only way to reach Carrier's API
      contracts and integration guides in machine-readable form — the docs host is a
      single-page app that returns an HTML shell for every conventional spec path.
      Verified queries: getDefaultProducts (the product catalogue),
      getPublicApiSpecYml and getPublicApiSpecJson (the OpenAPI documents), and
      getPublicProductInfo (contract plus structured guide). Introspection is disabled.
    humanURL: https://doc-api.fleet.lynx.carrier.io/
    baseURL: https://api.portal.fleet.lynx.carrier.io/public/graphql
    tags:
      - GraphQL
      - Developer Portal
      - Discovery
    properties:
      - type: GraphQL
        url: graphql/carrier-global-lynx-portal-graphql.yml
      - type: Documentation
        url: https://doc-api.fleet.lynx.carrier.io/
  - aid: carrier-global:i-vu-building-automation
    name: Carrier i-Vu Building Automation
    description: >-
      i-Vu is Carrier's web-based commercial building automation system for
      monitoring and controlling HVAC, lighting, and related building systems.
      It integrates with BACnet and other standard building protocols rather
      than a public REST API surface.
    humanURL: https://www.carrier.com/commercial/en/us/products/controls/building-automation/
    tags:
      - Building Automation
      - BACnet
      - HVAC
    properties:
      - type: Documentation
        url: https://www.carrier.com/commercial/en/us/products/controls/building-automation/
  - aid: carrier-global:carrier-comfort-network
    name: Carrier Comfort Network
    description: >-
      Carrier Comfort Network (CCN) is Carrier's proprietary control and
      communication network for tying together chillers, air handlers, and
      related HVAC equipment, typically integrated into BMS/BAS deployments.
    humanURL: https://www.carrier.com/commercial/en/us/products/controls/carrier-comfort-network/
    tags:
      - Building Automation
      - HVAC
      - Chillers
    properties:
      - type: Documentation
        url: https://www.carrier.com/commercial/en/us/products/controls/carrier-comfort-network/
  - aid: carrier-global:abound-building-platform
    name: Carrier Abound
    description: >-
      Abound is Carrier's cloud-based building intelligence platform that
      aggregates data from HVAC, IAQ sensors, and occupancy systems to provide
      indoor-environmental-quality analytics, energy insights, and
      healthy-building dashboards for commercial real estate operators.
    humanURL: https://abound.carrier.com
    tags:
      - Building Intelligence
      - IAQ
      - Analytics
    properties:
      - type: Documentation
        url: https://abound.carrier.com
  - aid: carrier-global:carrier-smarthome
    name: Carrier SmartHome App
    description: >-
      The Carrier SmartHome app lets homeowners remotely control Carrier
      connected smart thermostats and residential HVAC equipment. No public
      developer API is currently published; integration is via the consumer
      mobile app and connected thermostat web portals.
    humanURL: https://www.carrier.com/residential/en/us/products/thermostats/
    tags:
      - Smart Home
      - Thermostats
      - Residential
    properties:
      - type: Documentation
        url: https://www.carrier.com/residential/en/us/products/thermostats/
