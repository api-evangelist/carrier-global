          example: true
        RunMode:
          type: string
          description: Run Mode
          enum:
          - Continuous
          - Start/Stop
          example: Continuous
        ClearAlarms:
          type: boolean
          description: Clear alarm for specific device
          example: true
        InitiatePretrip:
          type: boolean
          description: Pre trip
          example: true
        TRUOnOff:
          type: string
          description: TRU on/off
          enum:
          - 'ON'
          - 'OFF'
          example: 'ON'
        SleepMode:
          type: string
          description: Sleep Mode
          enum:
          - 'ON'
          - 'OFF'
