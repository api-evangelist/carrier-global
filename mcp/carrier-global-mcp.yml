  - name: get_asset_history
    rest: asset-history-list-v1
    method: GET
    path: /v1/asset-history-items
    contract: lynx-fleet
    consequence: read
    summary: History for a single asset over a time window. One asset per request; 30-minute windows recommended.
  - name: get_multi_asset_history
    rest: multi-asset-history-v1
    method: POST
    path: /v1/multi-asset-history
    contract: lynx-fleet
    consequence: read
    summary: History for up to 10 assets in one call. POST is used to carry the id list, not to write.
  - name: list_asset_batteries
    rest: asset-battery-list-v1
    method: GET
    path: /v1/asset-batteries
    contract: lynx-fleet
    consequence: read
    summary: Current battery state for a list of assets.
  - name: get_asset_battery_history
    rest: asset-battery-history-list-v1
    method: GET
    path: /v1/asset-battery-history
    contract: lynx-fleet
    consequence: read
    summary: Battery event history for one asset.
  - name: get_multi_asset_battery_history
    rest: multi-asset-battery-history-v1
    method: POST
    path: /v1/multi-asset-battery-history
    contract: lynx-fleet
    consequence: read
    summary: Battery event history for several assets in one call.
  - name: get_alarm_codes
    rest: alarm-codes-and-descriptions-v1
    method: GET
    path: /v1/alarm-codes-and-descriptions
    contract: lynx-fleet
    consequence: read
    summary: The alarm-code dictionary, for resolving codes seen on assets.
  - name: ingest_scb_data
    rest: scb-ingestor-v1
    method: POST
    path: /v1/scb-ingestor
    contract: lynx-fleet
    consequence: write
    summary: Push third-party sensor data into the Lynx platform.
  - name: ingest_orbcomm_data
    rest: orbcomm-ingestor-v1
    method: POST
    path: /v1/orbcomm-ingestor
    contract: lynx-fleet
    consequence: write
