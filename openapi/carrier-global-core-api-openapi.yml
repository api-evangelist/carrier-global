        required: false
        allowEmptyValue: false
        schema:
          type: string
          example: '1099176'
      - name: startDate
        in: query
        description: Return data after this input. UTC date in ISO Date Time Format yyyy-MM-dd'T'HH:mm:ssZ. Effective June 12 2025:** the maximum allowed span between `startDate` and `endDate` is **7 days**.
        required: true
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
          example: '2019-05-17T08:30:00Z'
      - name: endDate
        in: query
        description: Return data before this input. UTC date in ISO Date Time Format yyyy-MM-dd'T'HH:mm:ssZ. Effective June 12 2025:** the maximum allowed span between `startDate` and `endDate` is **7 days**.
        required: true
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
          example: '2019-05-17T08:30:00Z'
      - name: limit
        in: query
        description: The number of items to return
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: nextToken
        in: query
        description: A pagination token used to return a set of results
        required: false
        allowEmptyValue: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
