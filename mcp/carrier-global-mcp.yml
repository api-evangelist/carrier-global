  - name: send_command
    rest: send-2way-commands
    method: POST
    path: /v1/send-commands
    contract: 2way-command
    consequence: physical-actuation
    escalation: human-confirmation-recommended
    summary: >-
      Change a setpoint, initiate defrost or pre-trip, clear alarms, toggle a
