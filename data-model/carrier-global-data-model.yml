alternate_keys:
  note: >-
    Every read operation accepts four interchangeable ways to name assets, which is
    unusual and worth stating plainly for an integrator.
  keys:
    - assetIds
    - assetNames
    - truSerialNumbers
    - licensePlateNumbers
  semantics: >-
    Supply none and you receive every asset the key is entitled to. The
    MultiAssetHistoryRequest / MultiAssetBatteryHistoryRequest bodies model the same
    choice as four parallel parameter objects (AssetParamWithId, AssetParamWithName,
    AssetParamWithTruSerialNumber, AssetParamWithLicensePlateNumber).
entities:
