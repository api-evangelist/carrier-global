name: Carrier Lynx Fleet MCP (candidate)
description: >-
  A CANDIDATE tool list derived from Carrier's three published OpenAPI contracts.
  Carrier ships no MCP server. Nothing here is running anywhere; this is a proposal
  grounded in real operationIds so an agent builder can see what a Lynx MCP surface
  would contain.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: derived
  note: >-
    SEARCHED AND NOT FOUND. No hosted MCP endpoint, no npx/pip package and no MCP
    mention exists on the Lynx Dev Portal, in the integration guide, in the Dev Portal's
    published JavaScript bundle, on npm, on PyPI, or in any Carrier GitHub organisation
    (github.com/carrier, /carrier-global, /carrierglobal, /lynxfleet all 404). No
    endpoint URL is guessed or probed, because a guessed MCP path that happens to
    answer 200 would read as a verified agent surface.
auth_model:
  scheme: apiKey
  header: x-lynx-api-key
  note: >-
    A Lynx MCP server would carry a single tenant API key. The key is entitlement-scoped
    server-side (tenant, assets, data types), so an agent's reach is whatever Carrier
    configured for that key — there is no per-tool scope to request.
tools:
  - name: list_assets
    rest: asset-list-v1
    method: GET
    path: /v1/assets
    contract: lynx-fleet
    consequence: read
    summary: Get the assets the API key is entitled to, optionally filtered by id, name, TRU serial or plate.
  - name: get_asset_snapshots
    rest: asset-snapshot-list-v1
    method: GET
    path: /v1/asset-snapshots
    contract: lynx-fleet
    consequence: read
