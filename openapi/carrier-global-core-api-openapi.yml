          - SAS3
          - SAS3_DATACOLD
          - BOX1
          - BOX1_DATACOLD
          - BOX2
          - BOX2_DATACOLD
          - BOX3
          - BOX3_DATACOLD
          example: RAS1
        connectionLocation:
          type: string
