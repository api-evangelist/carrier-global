cross_contract_note: >-
  The three contracts do NOT share a schema namespace. The truck/trailer surface is
  Asset-centric; the container surface is SourceData/UnifiedModel-centric and reuses
  none of the Asset schemas even though the guide describes both as the same "Lynx Data
  Offering". An integrator covering both fleets writes two mappings, not one.
