graphql_only:
  - field: getDefaultProducts
    reason: >-
      Portal catalogue. Lists the API products published in the Dev Portal, grouped by
      business unit (TTI, LFC, TTA), each with id, name, apiId and description. There is
      no REST equivalent — the only machine-readable index of Carrier's own API estate
      lives here.
    verified: probed 200
  - field: getPublicApiSpecYml
    reason: >-
      Serves the OpenAPI document for a product as YAML. This is how the three contracts
      in openapi/ were retrieved; no REST or static-file equivalent exists, because the
      docs host answers every conventional spec path with an HTML shell.
    verified: probed 200
  - field: getPublicApiSpecJson
    reason: Same contract as a JSON object. Declared in the portal bundle; not probed.
    verified: declared
  - field: getPublicProductInfo
    reason: >-
      Returns the contract plus the product's structured integration guide
      (authentication, rate limiting, errors, pagination, versioning, best practices,
      endpoint usage). The entire documentation corpus for these APIs is only reachable
      through this field.
    verified: probed 200
  - field: getPrimaryProducts
    reason: Returns an empty object anonymously; meaning not established.
    verified: probed 200
