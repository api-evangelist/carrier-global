    Send2wayCmdRequestBody:
      type: object
      description: Send 2way command
      required:
      - assetId
      properties:
        assetId:
          type: string
          description: Asset id
          example: 4323-sdjh-12fd-sdfa-3efv-2fdv
        GetActiveIntellisetId:
          type: number
          description: Specific Compartment number to get Active Intelliset for.
          example: 2
        SetActiveIntelliset:
          type: object
          description: Specify the active Intelliset (using its ID, between 1 and 31) for a particular compartment (1, 2, or 3) using a JSON structure.
          example:
            compartmentNumber: 2
            activeIntelliset: 3
          properties:
            compartmentNumber:
              type: number
              description: compartmentNumber
              example: 2
              readOnly: true
            activeIntelliset:
              type: number
              description: activeIntelliset ID
              example: 2
              readOnly: true
        CompartmentSetpoint1:
          type: number
          description: Compartment 1 Setpoint Temperature with a range of [-30, 35] °C or [-22, 95] °F
          example: 10
        CompartmentSetpoint2:
          type: number
          description: Compartment 2 Setpoint Temperature with a range of [-30, 35] °C or [-22, 95] °F
          example: 15
        CompartmentSetpoint3:
          type: number
          description: Compartment 3 Setpoint Temperature with a range of [-30, 35] °C or [-22, 95] °F
          example: -5
