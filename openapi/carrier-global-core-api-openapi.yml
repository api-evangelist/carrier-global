        description: Asset id (optional, but either assetId, assetName, truSerialNumber, or license plate number should be provided)
        required: false
        allowEmptyValue: false
        schema:
          type: string
          example: b1ac42db-3574-4d1c-aaa3-db1f669f693a
      - name: assetName
        in: query
        description: Asset name (optional, but either assetId, assetName, truSerialNumber, or licensePlateNumber should be provided)
        required: false
        allowEmptyValue: false
        schema:
          type: string
          example: Test-Asset-1
      - name: truSerialNumber
        in: query
        description: TRU serial number (optional, but either assetId, assetName, truSerialNumber, or licensePlateNumber should be provided)
        required: false
        allowEmptyValue: false
        schema:
