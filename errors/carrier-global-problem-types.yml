problem_types:
  - status: 400
    name: BadRequestError
    title: Bad Request
    detail: The request was unacceptable, often due to missing a required parameter.
    example_message: No match found
    docs_description: The request was rejected, usually due to a missing or incorrect parameter.
    remediation: >-
      Check required parameter combinations. Most list operations require at least one
      of assetIds / assetNames / truSerialNumbers / licensePlateNumbers on the command
      APIs; a stale local asset cache is the documented common cause, which is why
      Carrier advises re-syncing the asset list weekly.
    retryable: false
  - status: 401
    name: AuthRequestError
    title: Unauthorized
    detail: No valid API key provided.
    example_message: Unauthorized
    docs_description: Invalid API key provided, or API key not provided.
    remediation: >-
      Send the tenant API key in the x-lynx-api-key header over HTTPS. Requests without
      authentication and requests over plain HTTP both fail.
    retryable: false
  - status: 403
    name: ForbiddenRequestError
    title: Forbidden
    detail: The API key doesn't have permissions to perform the request.
    example_message: Access to the requested resource is forbidden
    docs_description: API Key doesn't have permission to perform requests.
    remediation: >-
      The key is entitled per tenant, asset and data type through Lynx API
      Configuration. Ask the Carrier Lynx Integration Team to extend the configuration
      rather than retrying.
    retryable: false
  - status: 429
    name: TooManyRequestsError
    title: Too Many Requests
    detail: >-
      Too many requests hit the API too quickly. We recommend exponential backoff of
      your requests.
    example_message: Too Many Requests
    docs_description: Too many requests hit the API too quickly.
    remediation: >-
      Back off exponentially with jitter. No Retry-After or RateLimit-* header is
      documented, so the client must choose the interval itself. The published quota is
      500,000 calls per month.
    retryable: true
  - status: 500
    name: UnexpectedError
    title: Server Error
    detail: Server error.
    example_message: Server Error
    docs_description: 'Unexpected Error: server error (documented as rare).'
    remediation: Retry with backoff; escalate to Lynx API Support if persistent.
    retryable: true
