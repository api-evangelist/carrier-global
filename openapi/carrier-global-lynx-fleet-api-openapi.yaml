paths:
  /v1/assets:
    get:
      operationId: asset-list-v1
      summary: Get assets list
      description: This operation will return all assets
      tags:
        - core
      parameters:
        - name: assetIds
          in: query
          description: >-
            List of asset ids (optional, comma separated. If neither assetIds,
            nor assetNames, nor truSerialNumbers, nor licensePlateNumbers are
            provided then all assets will be returned)
          required: false
          allowEmptyValue: false
          schema:
            type: string
            example: e3d4e850-28a7-4045-b5d3-bb58cad202b4
        - name: assetNames
          in: query
          description: >-
            List of asset names (optional, comma separated. If neither assetIds,
            nor assetNames, nor truSerialNumbers, nor licensePlateNumbers are
            provided then all assets will be returned)
          required: false
          allowEmptyValue: false
          schema:
            type: string
            example: TA12345
        - name: truSerialNumbers
          in: query
          description: >-
            List of asset TRU serial numbers (optional, comma separated. If
            neither assetIds, nor assetNames, nor truSerialNumbers, nor
            licensePlateNumbers are provided then all assets will be returned)
          required: false
          allowEmptyValue: false
          schema:
            type: string
            example: HD12345
        - name: licensePlateNumbers
          in: query
          description: >-
            List of license plate numbers (optional, comma separated. If neither
            assetIds, nor assetNames, nor truSerialNumbers, nor
            licensePlateNumbers are provided then all assets will be returned)
          required: false
          allowEmptyValue: false
          schema:
            type: string
            example: '1099176'
        - name: limit
          in: query
          description: The number of items to return
          required: false
          allowEmptyValue: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
        - name: nextToken
          in: query
          description: A pagination token used to return a set of results
          required: false
          allowEmptyValue: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRequestError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenRequestError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
