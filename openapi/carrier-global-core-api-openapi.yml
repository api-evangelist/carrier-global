        required: false
        allowEmptyValue: false
        schema:
          type: string
          example: Sample Asset
      - name: truSerialNumber
        in: query
        description: Asset TRU serial number (optional, but one is required -  assetID, assetName or truSerialNumber)
        required: false
        allowEmptyValue: false
        schema:
          type: string
          example: HD12345
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableCommandsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRequestError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenRequestError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
      summary: Get 2way commands
      x-summary-source: derived
    servers:
    - url: https://api.fleet.lynx.carrier.io/2waycmd
      description: prod
  /v1/send-commands:
    post:
      operationId: send-2way-commands
      description: This operation will send 2-way commands
      tags:
